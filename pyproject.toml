[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "immuknow-template-resources"
version = "0.1.0"
description = "Starter project resources for standalone ImmuKnow"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "prek",
    "ruff==0.17.2",
]
test = ["pytest", "pypdf==6.21.4"]

[tool.uv]
# Install maintainer tools only; ImmuKnow is a separately installed executable.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
markers = [
    "pipeline: renders the authored notices through the standalone ImmuKnow executable",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Include new authored files automatically; omit generated library and caches.
[tool.hatch.build]
only-include = [
    "src/immuknow_template",
    "input/sample/sample_students.csv",
    "sample.json",
    "templates",
    "config",
    "references",
    "scripts",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".python-version",
    "LICENSE",
    "README.md",
    "CONTRIBUTING.md",
    "pyproject.toml",
    "uv.lock",
    "immuknow-revision.txt",
]
exclude = ["/templates/lib", "**/__pycache__", "*.py[cod]"]

[tool.hatch.build.targets.wheel]
only-include = ["src/immuknow_template", "templates", "config", "references"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"templates" = "immuknow_template/data/templates"
"config" = "immuknow_template/data/config"
"references" = "immuknow_template/data/references"

[tool.hatch.build.targets.wheel.force-include]
"sample.json" = "immuknow_template/data/sample.json"
"input/sample/sample_students.csv" = "immuknow_template/data/input/sample/sample_students.csv"
".gitignore" = "immuknow_template/data/.gitignore"
"LICENSE" = "immuknow_template/data/LICENSE"
"README.md" = "immuknow_template/data/README.md"
"immuknow-revision.txt" = "immuknow_template/data/immuknow-revision.txt"
