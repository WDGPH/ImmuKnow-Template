[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "immuknow-template-resources"
version = "0.1.0"
description = "Verified ImmuKnow starter project resources"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

[tool.setuptools]
packages = ["immuknow_template"]
include-package-data = false
