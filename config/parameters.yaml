bundling:
  bundle_size: 100
  # Use school, board, language, page_count or notice_variant; combine them in a list.
  # Example: [board, language, page_count]
  group_by: null
school_validation:
  enabled: false
  # null uses school_reference.json in this config directory. Replace the
  # fictional list with your own, or set a path relative to this directory.
  reference_file: null
  target_phu: Cedar Ridge Health Unit
date_as_of: '2026-11-01'
date_of_delivery: '2026-11-15'
# Optional deadlines; use null when a date does not apply.
date_due: '2026-11-30'
date_of_suspension: '2026-12-01'
encryption:
  enabled: false
  password:
    template: '{date_of_birth_iso_compact}'
