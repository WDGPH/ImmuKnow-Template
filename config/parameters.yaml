bundling:
  bundle_size: 100
  # Use school, board, language, or page_count; combine them in a list.
  # Example: [board, language, page_count]
  group_by: null
school_validation:
  enabled: false
  # null uses the school list shipped with ImmuKnow. To use your own, add the
  # file to config/ and give its name here, e.g. school_reference.json.
  reference_file: null
  target_phu: Cedar Ridge Health Unit
  column_prefix: school_
date_as_of: '2026-09-30'
date_of_delivery: '2026-10-08'
encryption:
  enabled: false
  password:
    template: '{date_of_birth_iso_compact}'
pipeline:
  after_run:
    remove_artifacts: false
typst:
  bin: typst
