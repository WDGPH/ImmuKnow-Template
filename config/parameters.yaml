bundling:
  bundle_size: 100
  # Use school, board, language, page_count or notice_variant; combine them in a list.
  # Example: [board, language, page_count]
  group_by: null
  # Optional: source (default) or last_name_dob.
  # sort_by: last_name_dob
# Filename stems use supported {field} placeholders, like password templates.
# Core appends .pdf/.csv. Originals and protected copies use the individual stem.
filenames:
  individual:
    template: '{client_id}_{notice_variant}_{language_code}'
  bundle:
    # Works with size-only grouping. For school names, use
    # group_by: [school, notice_variant, language] above and the pattern
    # '{school}_{notice_variant}_{bundle_number}' here.
    template: '{route}_{bundle_number}'
  # Optional; omitted uses the bundle template with review_ prefixed.
  review_bundle:
    template: 'review_{bundle_number}'
# Explicit exceptions for repeated client IDs; quote IDs to keep leading zeros.
# Every repeated row is retained with a warning and shares its client's assignment.
allowed_duplicate_client_ids: []
school_validation:
  enabled: false
  # null uses school_reference.json in this config directory. Replace the
  # fictional list with your own, or set a path relative to this directory.
  reference_file: null
  target_phu: Cedar Ridge Health Unit
date_as_of: '2026-11-01'
date_of_delivery: '2026-11-15'
# Optional deadlines; use null when a date does not apply.
date_due: '2026-11-30'
date_of_suspension: '2026-12-01'
encryption:
  enabled: false
  password:
    template: '{date_of_birth_iso_compact}'
