name: Check project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Render with the pinned fonts below only, as ImmuKnow's CI does. If you change
      # the fonts in templates/settings.typ, install them here too.
      TYPST_FONT_PATHS: /usr/share/fonts/truetype/freefont
      TYPST_IGNORE_SYSTEM_FONTS: 'true'
      # Must match the Typst version ImmuKnow requires; check.py fails otherwise.
      TYPST_VERSION: 0.15.1
      TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
    strategy:
      fail-fast: false
      matrix:
        # The versions ImmuKnow is tested on.
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject client data files
        # The same check as the pre-commit hook, for commits made without it. The
        # push has already reached GitHub, but the files are kept out of main.
        run: python3 scripts/check_client_data.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Install fonts
        # The FreeFont release ImmuKnow's CI and Studio pin; newer FreeSerif doubles
        # accented capitals in PDF text.
        run: |
          curl -fL --retry 3 \
            https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-freefont/fonts-freefont-ttf_20120503-10build1_all.deb \
            -o "$RUNNER_TEMP/fonts.deb"
          echo "d1424c9d47b2a6bd0d5149ca66f2bab9b4365237bfbb6063659d961bab2f8ccb  $RUNNER_TEMP/fonts.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/fonts.deb" "$RUNNER_TEMP/fonts"
          sudo install -d /usr/share/fonts/truetype/freefont
          sudo install -m 644 "$RUNNER_TEMP/fonts/usr/share/fonts/truetype/freefont/"*.ttf /usr/share/fonts/truetype/freefont/

      - name: Install Typst
        run: |
          curl -fL --retry 3 \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            -o "$RUNNER_TEMP/typst.tar.xz"
          echo "${TYPST_SHA256}  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP" --strip-components=1
          install -D -m 755 "$RUNNER_TEMP/typst" "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the project
        run: uv run --locked python scripts/check.py --sample

      - name: Run tests
        run: uv run --locked pytest

      - name: Verify files were not changed
        run: test -z "$(git status --porcelain)"
