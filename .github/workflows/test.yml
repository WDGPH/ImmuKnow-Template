name: Check project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TYPST_FONT_PATHS: /usr/share/fonts/truetype/freefont
      TYPST_IGNORE_SYSTEM_FONTS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject client data files
        run: python3 scripts/check_client_data.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'

      - name: Install ImmuKnow v2.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=v2.0.0
          revision=$(gh api "repos/WDGPH/ImmuKnow/commits/$release" --jq .sha)
          test "$revision" = "$(tr -d '\r\n' < immuknow-revision.txt)"
          mkdir -p "$RUNNER_TEMP/immuknow"
          cd "$RUNNER_TEMP/immuknow"
          url="https://github.com/WDGPH/ImmuKnow/releases/download/$release"
          curl --fail --location --retry 3 -O "$url/immuknow-2.0.0-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 -O "$url/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf immuknow-2.0.0-linux-x86_64.tar.gz
          test "$(./immuknow --version)" = 'immuknow 2.0.0'
          echo "$RUNNER_TEMP/immuknow" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Check Python lint and formatting
        run: |
          uv run --locked ruff check --no-fix .
          uv run --locked ruff format --check .

      - name: Install fonts
        run: |
          curl -fL --retry 3 \
            https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-freefont/fonts-freefont-ttf_20120503-10build1_all.deb \
            -o "$RUNNER_TEMP/fonts.deb"
          echo "d1424c9d47b2a6bd0d5149ca66f2bab9b4365237bfbb6063659d961bab2f8ccb  $RUNNER_TEMP/fonts.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/fonts.deb" "$RUNNER_TEMP/fonts"
          sudo install -d /usr/share/fonts/truetype/freefont
          sudo install -m 644 "$RUNNER_TEMP/fonts/usr/share/fonts/truetype/freefont/"*.ttf /usr/share/fonts/truetype/freefont/

      - name: Check the project
        run: |
          immuknow project sync
          immuknow project check

      - name: Run tests
        run: uv run --locked --group test pytest

      - name: Verify files were not changed
        run: test -z "$(git status --porcelain)"
