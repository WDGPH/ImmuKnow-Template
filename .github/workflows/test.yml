name: Check project

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TYPST_FONT_PATHS: /usr/share/fonts/truetype/freefont
      TYPST_IGNORE_SYSTEM_FONTS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject client data files
        run: python3 scripts/check_client_data.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.12'

      - name: Cache Rust dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/target
          key: ${{ runner.os }}-immuknow-core-${{ hashFiles('core-revision.txt') }}

      - name: Install pinned standalone Core
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          cargo +1.92.0 install --git https://github.com/WDGPH/ImmuKnow \
            --rev "$(cat core-revision.txt)" --locked --root "$RUNNER_TEMP/core"
          echo "$RUNNER_TEMP/core/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Check Python lint and formatting
        run: |
          uv run --locked ruff check --no-fix .
          uv run --locked ruff format --check .

      - name: Install fonts
        run: |
          curl -fL --retry 3 \
            https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-freefont/fonts-freefont-ttf_20120503-10build1_all.deb \
            -o "$RUNNER_TEMP/fonts.deb"
          echo "d1424c9d47b2a6bd0d5149ca66f2bab9b4365237bfbb6063659d961bab2f8ccb  $RUNNER_TEMP/fonts.deb" | sha256sum --check
          dpkg-deb --extract "$RUNNER_TEMP/fonts.deb" "$RUNNER_TEMP/fonts"
          sudo install -d /usr/share/fonts/truetype/freefont
          sudo install -m 644 "$RUNNER_TEMP/fonts/usr/share/fonts/truetype/freefont/"*.ttf /usr/share/fonts/truetype/freefont/

      - name: Check the project
        run: uv run --locked --group test python scripts/check.py

      - name: Run tests
        run: uv run --locked --group test pytest

      - name: Verify files were not changed
        run: test -z "$(git status --porcelain)"
